RedisAddr: localhost:6379
RedisPass: ""
RedisDB: 0

Limiter:
  WindowSec: 60
  GuestLimit: 30
  UserLimit: 100
  AdminBypass: true

IPRisk:
  Enabled: true
  BlacklistTTL: 10
  MaxFails: 3
  RiskQuotaRatio: 0.2
  CountryHeader: CF-IPCountry
  Whitelist: []
  HighRiskCountries:
    - RU
    - UA
    - NG
    - BD
    - PK
    - VN
    - ID

Privacy:
  Enabled: true
  SensitiveHeaders:
    - Authorization
    - Email
    - Device-Id
    - X-Device-Id
  TimezoneHeader: X-Timezone
